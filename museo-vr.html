<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Museo VR - Modo Inmersivo</title>
    <!-- Importar A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- Componente JavaScript personalizado para el teletransporte -->
    <script>
        AFRAME.registerComponent('teleport-click', {
            init: function () {
                // Seleccionamos el "Rig" (el contenedor principal del usuario)
                let rig = document.querySelector('#cameraRig');

                // Escuchamos el evento de clic (gatillo del mando Shinecon o toque en la pantalla)
                this.el.addEventListener('click', function (evt) {
                    // Extraemos las coordenadas (X, Y, Z) donde el láser golpeó el suelo
                    let punto = evt.detail.intersection.point;

                    // Deslizamos suavemente el Rig a esa posición. 
                    // Forzamos la Y en 0 para mantenernos al nivel del piso.
                    rig.setAttribute('animation', `property: position; to: ${punto.x} 0 ${punto.z}; dur: 400; easing: easeOutQuad`);
                });
            }
        });
    </script>
</head>

<body>
    <!-- Todo lo contenido en a-scene es procesado por la GPU para WebXR -->
    <a-scene background="color: #121212">

        <!-- 1. Sistema de Cámara y Movimiento (Rig) -->
        <!-- Se envuelve la cámara en un "Rig" para desplazar el cuerpo sin sobreescribir el giroscopio -->
        <a-entity id="cameraRig" position="0 0 0">
            <!-- 1.6 metros representa la altura promedio de los ojos humanos -->
            <a-camera position="0 1.6 0">
                <!-- Retícula visual: interactúa únicamente con objetos que tengan la clase .piso-interactivo -->
                <a-cursor color="#00FF00" raycaster="objects: .piso-interactivo"
                    animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
                </a-cursor>
            </a-camera>
        </a-entity>

        <!-- 2. El Entorno 3D -->
        <!-- Aquí cargarás tu habitacion.glb. Por ahora usamos figuras geométricas de prueba -->
        <a-box position="0 1 -5" width="2" height="2" depth="2" color="#d84315"></a-box>
        <a-cylinder position="4 1 -3" radius="0.5" height="2" color="#ffca28"></a-cylinder>

        <!-- 3. Los Suelos -->
        <!-- Suelo visual estético (Gris oscuro) -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#2a2a2a"></a-plane>

        <!-- Suelo lógico invisible: reacciona al láser y ejecuta el script 'teleport-click' -->
        <a-plane class="piso-interactivo" teleport-click position="0 0.01 0" rotation="-90 0 0" width="30" height="30"
            material="opacity: 0.0; transparent: true">
        </a-plane>

    </a-scene>
</body>

</html>
