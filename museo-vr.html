<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Museo VR - Modo Inmersivo</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script>
        // 1. Atenuar el brillo de las paredes blancas del GLB para confort en lentes RV
        AFRAME.registerComponent('ajuste-visual-sala', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const mesh = this.el.getObject3D('mesh');
                    if (!mesh) return;
                    mesh.traverse((nodo) => {
                        if (nodo.isMesh && nodo.material) {
                            const c = nodo.material.color;
                            if (c && c.r > 0.7 && c.g > 0.7 && c.b > 0.7) {
                                nodo.material.color.setHex(0x7c828d);
                                nodo.material.roughness = 0.92;
                                nodo.material.metalness = 0.05;
                            }
                        }
                    });
                });
            }
        });

        // 2. Generador de Carteles Informativos 3D (soporta tildes y ñ)
        AFRAME.registerComponent('cartel-museo', {
            schema: {
                titulo: { type: 'string', default: 'Pieza en exhibición' },
                periodo: { type: 'string', default: 'Período Cretácico' },
                descripcion: { type: 'string', default: 'Descripción de la pieza paleontológica.' }
            },
            init: function () {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 640;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#161922';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 14;
                ctx.strokeRect(24, 24, canvas.width - 48, canvas.height - 48);

                ctx.fillStyle = '#f5d061';
                ctx.font = 'bold 58px sans-serif';
                ctx.fillText(this.data.titulo, 65, 115);

                ctx.fillStyle = '#8ab4f8';
                ctx.font = 'italic 40px sans-serif';
                ctx.fillText(this.data.periodo, 65, 175);

                ctx.fillStyle = '#3a4152';
                ctx.fillRect(65, 205, canvas.width - 130, 4);

                ctx.fillStyle = '#e8eaed';
                ctx.font = '38px sans-serif';
                const palabras = this.data.descripcion.split(' ');
                let linea = '';
                let y = 275;
                const maxAncho = canvas.width - 130;

                for (let i = 0; i < palabras.length; i++) {
                    const prueba = linea + palabras[i] + ' ';
                    if (ctx.measureText(prueba).width > maxAncho && i > 0) {
                        ctx.fillText(linea, 65, y);
                        linea = palabras[i] + ' ';
                        y += 54;
                    } else {
                        linea = prueba;
                    }
                }
                ctx.fillText(linea, 65, y);

                const textura = new THREE.CanvasTexture(canvas);
                const geometria = new THREE.PlaneGeometry(0.95, 0.6);
                const material = new THREE.MeshBasicMaterial({ map: textura, side: THREE.DoubleSide });
                const malla = new THREE.Mesh(geometria, material);
                this.el.setObject3D('mesh', malla);
            }
        });

        // 3. Locomoción + Giro con Stick Derecho (Modo Normal y Modo VR)
        AFRAME.registerComponent('control-locomocion', {
            schema: {
                velocidad: { type: 'number', default: 2.6 },
                velocidadGiro: { type: 'number', default: 85 } // Grados por segundo
            },
            init: function () {
                this.teclas = {};
                this.dirAdelante = new THREE.Vector3();
                this.dirDerecha = new THREE.Vector3();
                this.vectorArriba = new THREE.Vector3(0, 1, 0);

                // Asegurar que no quede ninguna animación residual de teletransporte
                this.el.removeAttribute('animation');

                window.addEventListener('keydown', (e) => { this.teclas[e.code] = true; });
                window.addEventListener('keyup', (e) => { this.teclas[e.code] = false; });
            },
            tick: function (tiempo, delta) {
                if (!delta) return;
                // Limitamos dt a máximo 50ms (0.05s) para evitar "saltos" cuando cae un fotograma en VR
                const dt = Math.min(delta / 1000, 0.05);

                let ejeX = 0;    // Caminar lateralmente
                let ejeY = 0;    // Caminar adelante / atrás
                let ejeGiro = 0; // Girar cámara izquierda / derecha

                // A. Entrada por teclado (WASD/Flechas para moverse, Q/E para girar vista)
                if (this.teclas['KeyW'] || this.teclas['ArrowUp']) ejeY -= 1;
                if (this.teclas['KeyS'] || this.teclas['ArrowDown']) ejeY += 1;
                if (this.teclas['KeyA'] || this.teclas['ArrowLeft']) ejeX -= 1;
                if (this.teclas['KeyD'] || this.teclas['ArrowRight']) ejeX += 1;
                if (this.teclas['KeyQ']) ejeGiro -= 1;
                if (this.teclas['KeyE']) ejeGiro += 1;

                // B. Entrada por mando físico Bluetooth (GameSir)
                const DEADZONE = 0.22;
                const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];

                for (let i = 0; i < gamepads.length; i++) {
                    const gp = gamepads[i];
                    // Ignorar gamepads vacíos o virtuales de pantalla
                    if (!gp || !gp.connected || !gp.axes || gp.axes.length < 2) continue;

                    // Stick Izquierdo: Desplazamiento (axes 0 y 1)
                    if (Math.abs(gp.axes[0]) > DEADZONE) ejeX = gp.axes[0];
                    if (Math.abs(gp.axes[1]) > DEADZONE) ejeY = gp.axes[1];

                    // Stick Derecho: Giro horizontal de cámara (axis 2)
                    if (gp.axes.length >= 3 && Math.abs(gp.axes[2]) > DEADZONE) {
                        ejeGiro = gp.axes[2];
                    }

                    // Cruceta (D-Pad) opcional para caminar
                    if (gp.buttons && gp.buttons.length >= 16) {
                        if (gp.buttons[12] && gp.buttons[12].pressed) ejeY = -1;
                        if (gp.buttons[13] && gp.buttons[13].pressed) ejeY = 1;
                        if (gp.buttons[14] && gp.buttons[14].pressed) ejeX = -1;
                        if (gp.buttons[15] && gp.buttons[15].pressed) ejeX = 1;
                    }
                    break; // Tomamos solo el primer mando activo para no duplicar lecturas
                }

                // 1. Aplicar giro horizontal sobre el Rig (funciona en PC y dentro de VR)
                if (Math.abs(ejeGiro) > 0.05) {
                    const radPorSeg = THREE.MathUtils.degToRad(this.data.velocidadGiro);
                    this.el.object3D.rotation.y -= ejeGiro * radPorSeg * dt;
                    this.el.object3D.updateMatrixWorld(true);
                }

                // 2. Aplicar desplazamiento si se mueve el stick izquierdo o teclado
                if (Math.abs(ejeX) < 0.05 && Math.abs(ejeY) < 0.05) return;

                const camaraActiva = this.el.sceneEl.camera;
                if (!camaraActiva) return;

                camaraActiva.getWorldDirection(this.dirAdelante);
                this.dirAdelante.y = 0;
                if (this.dirAdelante.lengthSq() > 0.0001) {
                    this.dirAdelante.normalize();
                }

                this.dirDerecha.crossVectors(this.dirAdelante, this.vectorArriba).normalize();

                const avance = -ejeY;
                const lateral = ejeX;

                const dx = (this.dirAdelante.x * avance + this.dirDerecha.x * lateral) * this.data.velocidad * dt;
                const dz = (this.dirAdelante.z * avance + this.dirDerecha.z * lateral) * this.data.velocidad * dt;

                const pos = this.el.object3D.position;
                pos.x = Math.max(-5.8, Math.min(5.8, pos.x + dx));
                pos.z = Math.max(-7.8, Math.min(7.8, pos.z + dz));
            }
        });
    </script>
</head>

<body>
    <a-scene background="color: #121212" renderer="colorManagement: true; exposure: 0.75">

        <a-assets>
            <a-asset-item id="sala-museo-glb" src="assets/modelos/sala_museo.glb"></a-asset-item>
            <a-asset-item id="pieza1" src="assets/modelos/Duck.glb"></a-asset-item>
            <a-asset-item id="pieza2" src="assets/modelos/CesiumMan.glb"></a-asset-item>
        </a-assets>

        <!-- Iluminación tenue y cálida pensada para visores RV -->
        <a-light type="ambient" color="#cfd8dc" intensity="0.40"></a-light>
        <a-light type="point" color="#ffe0b2" intensity="0.45" position="0 4.2 0" distance="18"></a-light>
        <a-light type="point" color="#ffe0b2" intensity="0.35" position="0 4.2 -5.5" distance="15"></a-light>
        <a-light type="point" color="#ffe0b2" intensity="0.35" position="0 4.2 5.5" distance="15"></a-light>

        <!-- Sistema de Cámara y Movimiento -->
        <a-entity id="cameraRig" position="0 0 7.0" control-locomocion="velocidad: 2.6; velocidadGiro: 85">
            <a-camera position="0 1.65 0" look-controls="pointerLockEnabled: false">
            </a-camera>
        </a-entity>

        <!-- Habitación del Museo con atenuador de brillo automático -->
        <a-entity id="sala-museo" gltf-model="#sala-museo-glb" position="0 0 0" ajuste-visual-sala></a-entity>

        <!-- EXHIBICIÓN 1 (Oeste): Modelo + Cartel Informativo -->
        <a-entity gltf-model="#pieza1" position="-4.48 1.00 0" rotation="0 90 0" scale="1 1 1"></a-entity>
        <a-entity position="-3.35 1.15 0" rotation="-25 90 0"
            cartel-museo="titulo: Cráneo de Triceratops; periodo: Cretácico Superior (68 Ma); descripcion: Herbívoro ceratópsido caracterizado por su gran gola ósea y tres cuernos faciales defensivos.">
        </a-entity>

        <!-- EXHIBICIÓN 2 (Este): Modelo + Cartel Informativo -->
        <a-entity gltf-model="#pieza2" position="4.48 1.00 0" rotation="0 -90 0" scale="1 1 1"></a-entity>
        <a-entity position="3.35 1.15 0" rotation="-25 -90 0"
            cartel-museo="titulo: Giganotosaurus Carolinii; periodo: Cretácico Superior (98 Ma); descripcion: Uno de los mayores terópodos carnívoros conocidos, hallado en la Patagonia argentina.">
        </a-entity>

    </a-scene>
</body>

</html>
