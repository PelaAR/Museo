<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Museo VR - Modo Inmersivo</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script>
      // Registro global de posiciones reales detectadas dentro de sala_museo.glb
      window.DATOS_SALA_MUSEO = {
        listo: false,
        pedestales: [],
        tarimaCentral: null,
        atriles: [],
        callbacks: [],
        alEstarListo: function (fn) {
          if (this.listo) fn();
          else this.callbacks.push(fn);
        },
      };

      // 1. Atenuar brillo de paredes + Detectar coordenadas exactas de pedestales y atriles
      AFRAME.registerComponent("ajuste-visual-sala", {
        init: function () {
          this.el.addEventListener("model-loaded", () => {
            const mesh = this.el.getObject3D("mesh");
            if (!mesh) return;

            this.el.object3D.updateMatrixWorld(true);
            const pedestales = [];
            const atriles = [];
            let tarimaCentral = null;

            mesh.traverse((nodo) => {
              if (!nodo.isMesh) return;

              // Atenuar paredes blancas para confort en lentes RV
              if (nodo.material && nodo.material.color) {
                const c = nodo.material.color;
                if (c.r > 0.7 && c.g > 0.7 && c.b > 0.7) {
                  nodo.material.color.setHex(0x7c828d);
                  nodo.material.roughness = 0.92;
                  nodo.material.metalness = 0.05;
                }
              }

              // Medir cada pieza arquitectónica de la sala para encontrar stands y atriles
              const box = new THREE.Box3().setFromObject(nodo);
              if (box.isEmpty()) return;
              const size = box.getSize(new THREE.Vector3());
              const center = box.getCenter(new THREE.Vector3());

              // A. Detectar tapa superior de los pedestales laterales (~1.24m x 1.24m, Y ~ 1.0m)
              if (
                Math.abs(center.x) > 2.5 &&
                size.x > 0.95 &&
                size.x < 1.65 &&
                size.z > 0.95 &&
                size.z < 1.65 &&
                box.max.y > 0.92 &&
                box.max.y < 1.12
              ) {
                pedestales.push({
                  x: center.x,
                  y: box.max.y,
                  z: center.z,
                });
              }

              // B. Detectar plataforma de la tarima central (~3.5m x 6.0m, Y ~ 0.40m)
              if (
                Math.abs(center.x) < 1.2 &&
                size.x > 2.5 &&
                size.x < 5.5 &&
                size.z > 4.0 &&
                size.z < 8.5 &&
                box.max.y > 0.32 &&
                box.max.y < 0.52
              ) {
                tarimaCentral = {
                  x: center.x,
                  y: box.max.y,
                  z: center.z,
                };
              }

              // C. Detectar placas inclinadas de los atriles negros (Y entre 0.75m y 1.15m)
              if (
                box.min.y > 0.68 &&
                box.max.y < 1.18 &&
                size.x > 0.2 &&
                size.x < 0.75 &&
                size.z > 0.2 &&
                size.z < 0.75
              ) {
                atriles.push({
                  x: center.x,
                  y: box.max.y,
                  z: center.z,
                });
              }
            });

            window.DATOS_SALA_MUSEO.pedestales = pedestales;
            window.DATOS_SALA_MUSEO.tarimaCentral = tarimaCentral;
            window.DATOS_SALA_MUSEO.atriles = atriles;
            window.DATOS_SALA_MUSEO.listo = true;

            window.DATOS_SALA_MUSEO.callbacks.forEach((cb) => cb());
            window.DATOS_SALA_MUSEO.callbacks = [];
          });
        },
      });

      // 2. Auto-centrado sobre el pedestal real con soporte para elevación
      AFRAME.registerComponent("ajustar-al-pedestal", {
        schema: {
          tamanoMax: { type: "number", default: 1.15 },
          elevacion: { type: "number", default: 0.0 }, // NUEVO: Altura extra en metros sobre el stand
        },
        init: function () {
          this.el.addEventListener("model-loaded", () => {
            window.DATOS_SALA_MUSEO.alEstarListo(() => {
              this.encajarModelo();
            });
          });
        },
        encajarModelo: function () {
          const mesh = this.el.getObject3D("mesh");
          if (!mesh) return;

          const posEntidad = this.el.object3D.position;

          // 1. Buscar el pedestal real más cercano en sala_museo.glb y mover la entidad allí
          if (
            Math.abs(posEntidad.x) < 1.8 &&
            window.DATOS_SALA_MUSEO.tarimaCentral
          ) {
            const t = window.DATOS_SALA_MUSEO.tarimaCentral;
            posEntidad.set(t.x, t.y, t.z);
          } else if (window.DATOS_SALA_MUSEO.pedestales.length > 0) {
            let mejor = null;
            let minDist = Infinity;
            window.DATOS_SALA_MUSEO.pedestales.forEach((p) => {
              const d = Math.hypot(p.x - posEntidad.x, p.z - posEntidad.z);
              if (d < minDist) {
                minDist = d;
                mejor = p;
              }
            });
            if (mejor && minDist < 3.5) {
              posEntidad.set(mejor.x, mejor.y, mejor.z);
            }
          }

          // 2. Resetear transformaciones internas de la malla y medir tamaño original
          mesh.position.set(0, 0, 0);
          mesh.scale.set(1, 1, 1);
          this.el.object3D.updateMatrixWorld(true);

          const box1 = new THREE.Box3().setFromObject(mesh);
          if (box1.isEmpty()) return;

          const size = box1.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim > 0) {
            const escala = this.data.tamanoMax / maxDim;
            mesh.scale.setScalar(escala);
          }

          // 3. Medir la malla ya escalada y alinear su base al pedestal sumando la elevación
          this.el.object3D.updateMatrixWorld(true);
          const box2 = new THREE.Box3().setFromObject(mesh);
          const center2 = box2.getCenter(new THREE.Vector3());

          const destinoMundo = new THREE.Vector3();
          this.el.object3D.getWorldPosition(destinoMundo);

          const deltaMundo = new THREE.Vector3(
            destinoMundo.x - center2.x,
            destinoMundo.y - box2.min.y + this.data.elevacion, // Se aplica la elevación aquí
            destinoMundo.z - center2.z,
          );

          const posActualMallaMundo = new THREE.Vector3();
          mesh.getWorldPosition(posActualMallaMundo);
          const nuevaPosMallaMundo = posActualMallaMundo.add(deltaMundo);

          this.el.object3D.worldToLocal(nuevaPosMallaMundo);
          mesh.position.copy(nuevaPosMallaMundo);
          this.el.object3D.updateMatrixWorld(true);
        },
      });

      // 3. Carteles Informativos Grandes (0.95m x 0.60m) con auto-ajuste al atril más cercano
      AFRAME.registerComponent("cartel-museo", {
        schema: {
          titulo: { type: "string", default: "Pieza en exhibición" },
          periodo: { type: "string", default: "Período Cretácico" },
          descripcion: {
            type: "string",
            default: "Descripción de la pieza paleontológica.",
          },
        },
        init: function () {
          const canvas = document.createElement("canvas");
          canvas.width = 1024;
          canvas.height = 640;
          const ctx = canvas.getContext("2d");

          ctx.fillStyle = "#161922";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.strokeStyle = "#d4af37";
          ctx.lineWidth = 14;
          ctx.strokeRect(24, 24, canvas.width - 48, canvas.height - 48);

          ctx.fillStyle = "#f5d061";
          ctx.font = "bold 58px sans-serif";
          ctx.fillText(this.data.titulo, 65, 115);

          ctx.fillStyle = "#8ab4f8";
          ctx.font = "italic 40px sans-serif";
          ctx.fillText(this.data.periodo, 65, 175);

          ctx.fillStyle = "#3a4152";
          ctx.fillRect(65, 205, canvas.width - 130, 4);

          ctx.fillStyle = "#e8eaed";
          ctx.font = "38px sans-serif";
          const palabras = this.data.descripcion.split(" ");
          let linea = "";
          let y = 275;
          const maxAncho = canvas.width - 130;

          for (let i = 0; i < palabras.length; i++) {
            const prueba = linea + palabras[i] + " ";
            if (ctx.measureText(prueba).width > maxAncho && i > 0) {
              ctx.fillText(linea, 65, y);
              linea = palabras[i] + " ";
              y += 54;
            } else {
              linea = prueba;
            }
          }
          ctx.fillText(linea, 65, y);

          const textura = new THREE.CanvasTexture(canvas);
          const geometria = new THREE.PlaneGeometry(0.95, 0.6);
          const material = new THREE.MeshBasicMaterial({
            map: textura,
            side: THREE.DoubleSide,
          });
          const malla = new THREE.Mesh(geometria, material);
          malla.position.set(0, 0, 0.03);
          this.el.setObject3D("mesh", malla);

          window.DATOS_SALA_MUSEO.alEstarListo(() => {
            const pos = this.el.object3D.position;
            let mejorAtril = null;
            let minDist = Infinity;
            window.DATOS_SALA_MUSEO.atriles.forEach((a) => {
              const d = Math.hypot(a.x - pos.x, a.z - pos.z);
              if (d < minDist) {
                minDist = d;
                mejorAtril = a;
              }
            });
            if (mejorAtril && minDist < 3.5) {
              pos.set(mejorAtril.x, mejorAtril.y + 0.04, mejorAtril.z);
              this.el.object3D.updateMatrixWorld(true);
            }
          });
        },
      });

      // 4. Locomoción + Rotación de Cabeza en el Lugar (Stick Derecho y Teclado)
      AFRAME.registerComponent("control-locomocion", {
        schema: {
          velocidad: { type: "number", default: 2.6 },
          velocidadGiro: { type: "number", default: 85 },
        },
        init: function () {
          this.teclas = {};
          this.dirAdelante = new THREE.Vector3();
          this.dirDerecha = new THREE.Vector3();
          this.vectorArriba = new THREE.Vector3(0, 1, 0);
          this.pitchVR = 0;

          window.addEventListener("keydown", (e) => {
            this.teclas[e.code] = true;
          });
          window.addEventListener("keyup", (e) => {
            this.teclas[e.code] = false;
          });
        },
        tick: function (tiempo, delta) {
          if (!delta) return;
          const dt = Math.min(delta / 1000, 0.05);

          const camEl = this.el.querySelector("[camera]");
          if (!camEl) return;

          camEl.object3D.position.x = 0;
          camEl.object3D.position.z = 0;

          let ejeX = 0;
          let ejeY = 0;
          let ejeGiroX = 0;
          let ejeGiroY = 0;

          if (this.teclas["KeyW"] || this.teclas["ArrowUp"]) ejeY -= 1;
          if (this.teclas["KeyS"] || this.teclas["ArrowDown"]) ejeY += 1;
          if (this.teclas["KeyA"] || this.teclas["ArrowLeft"]) ejeX -= 1;
          if (this.teclas["KeyD"] || this.teclas["ArrowRight"]) ejeX += 1;
          if (this.teclas["KeyQ"]) ejeGiroX -= 1;
          if (this.teclas["KeyE"]) ejeGiroX += 1;
          if (this.teclas["KeyR"]) ejeGiroY -= 1;
          if (this.teclas["KeyF"]) ejeGiroY += 1;

          const DEADZONE = 0.22;
          const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];

          for (let i = 0; i < gamepads.length; i++) {
            const gp = gamepads[i];
            if (!gp || !gp.connected || !gp.axes || gp.axes.length < 2)
              continue;

            if (Math.abs(gp.axes[0]) > DEADZONE) ejeX = gp.axes[0];
            if (Math.abs(gp.axes[1]) > DEADZONE) ejeY = gp.axes[1];
            if (gp.axes.length >= 3 && Math.abs(gp.axes[2]) > DEADZONE) {
              ejeGiroX = gp.axes[2];
            }
            if (gp.axes.length >= 4 && Math.abs(gp.axes[3]) > DEADZONE) {
              ejeGiroY = gp.axes[3];
            }

            if (gp.buttons && gp.buttons.length >= 16) {
              if (gp.buttons[12] && gp.buttons[12].pressed) ejeY = -1;
              if (gp.buttons[13] && gp.buttons[13].pressed) ejeY = 1;
              if (gp.buttons[14] && gp.buttons[14].pressed) ejeX = -1;
              if (gp.buttons[15] && gp.buttons[15].pressed) ejeX = 1;
            }
            break;
          }

          const radPorSeg = THREE.MathUtils.degToRad(this.data.velocidadGiro);
          const maxPitch = THREE.MathUtils.degToRad(65);
          const enModoVR = this.el.sceneEl && this.el.sceneEl.is("vr-mode");
          const lookControls = camEl.components["look-controls"];

          if (
            !enModoVR &&
            lookControls &&
            lookControls.yawObject &&
            lookControls.pitchObject
          ) {
            if (Math.abs(ejeGiroX) > 0.05) {
              lookControls.yawObject.rotation.y -= ejeGiroX * radPorSeg * dt;
            }
            if (Math.abs(ejeGiroY) > 0.05) {
              lookControls.pitchObject.rotation.x = THREE.MathUtils.clamp(
                lookControls.pitchObject.rotation.x - ejeGiroY * radPorSeg * dt,
                -maxPitch,
                maxPitch,
              );
            }
          } else if (enModoVR) {
            if (Math.abs(ejeGiroX) > 0.05) {
              this.el.object3D.rotation.y -= ejeGiroX * radPorSeg * dt;
            }
            if (Math.abs(ejeGiroY) > 0.05) {
              this.pitchVR = THREE.MathUtils.clamp(
                this.pitchVR - ejeGiroY * radPorSeg * dt,
                -maxPitch,
                maxPitch,
              );
              camEl.object3D.rotation.x = this.pitchVR;
            }
          }

          if (Math.abs(ejeX) < 0.05 && Math.abs(ejeY) < 0.05) return;

          const camaraActiva = this.el.sceneEl.camera;
          if (!camaraActiva) return;

          camaraActiva.getWorldDirection(this.dirAdelante);
          this.dirAdelante.y = 0;
          if (this.dirAdelante.lengthSq() > 0.0001) {
            this.dirAdelante.normalize();
          }

          this.dirDerecha
            .crossVectors(this.dirAdelante, this.vectorArriba)
            .normalize();

          const avance = -ejeY;
          const lateral = ejeX;

          const dx =
            (this.dirAdelante.x * avance + this.dirDerecha.x * lateral) *
            this.data.velocidad *
            dt;
          const dz =
            (this.dirAdelante.z * avance + this.dirDerecha.z * lateral) *
            this.data.velocidad *
            dt;

          const pos = this.el.object3D.position;
          pos.x = Math.max(-6.4, Math.min(6.4, pos.x + dx));
          pos.z = Math.max(-8.8, Math.min(8.8, pos.z + dz));
        },
      });
    </script>
  </head>

  <body>
    <a-scene
      background="color: #121212"
      renderer="colorManagement: true; exposure: 0.75"
    >
      <a-assets>
        <a-asset-item
          id="sala-museo-glb"
          src="assets/modelos/sala_museo.glb"
        ></a-asset-item>
        <a-asset-item
          id="pieza1"
          src="assets/modelos/fosil__tengkorak_macaca.glb"
        ></a-asset-item>
        <a-asset-item
          id="pieza2"
          src="assets/modelos/montsecosuchus_depereti.glb"
        ></a-asset-item>
        <a-asset-item
          id="pieza3"
          src="assets/modelos/muestra_coleccion_paleontologica-GHUNLPam-15375.glb"
        ></a-asset-item>
        <a-asset-item
          id="pieza4"
          src="assets/modelos/muestra_coleccion_paleontologica-GHUNLPam-28000.glb"
        ></a-asset-item>
        <a-asset-item
          id="pieza5"
          src="assets/modelos/muestra_coleccion_ricardo-GHUNLPam29818.glb"
        ></a-asset-item>
        <a-asset-item
          id="pieza6"
          src="assets/modelos/sarcosuchus_imperator.glb"
        ></a-asset-item>
        <a-asset-item
          id="pieza7"
          src="assets/modelos/muestra_coleccion_ricardo-Avipeda-8643.glb"
        ></a-asset-item>
      </a-assets>

      <!-- Iluminación tenue y cálida pensada para visores RV -->
      <a-light type="ambient" color="#cfd8dc" intensity="0.40"></a-light>
      <a-light
        type="point"
        color="#ffe0b2"
        intensity="0.45"
        position="0 4.2 0"
        distance="18"
      ></a-light>
      <a-light
        type="point"
        color="#ffe0b2"
        intensity="0.35"
        position="0 4.2 -5.5"
        distance="15"
      ></a-light>
      <a-light
        type="point"
        color="#ffe0b2"
        intensity="0.35"
        position="0 4.2 5.5"
        distance="15"
      ></a-light>

      <!-- Sistema de Cámara -->
      <a-entity
        id="cameraRig"
        position="0 0 7.0"
        control-locomocion="velocidad: 2.6; velocidadGiro: 85"
      >
        <a-camera
          position="0 1.65 0"
          look-controls="pointerLockEnabled: false"
          wasd-controls="enabled: false"
        >
        </a-camera>
      </a-entity>

      <!-- Habitación del Museo -->
      <a-entity
        id="sala-museo"
        gltf-model="#sala-museo-glb"
        position="0 0 0"
        ajuste-visual-sala
      ></a-entity>

      <!-- ========================================================= -->
      <!-- TARIMA CENTRAL: Esqueleto Principal + Cartel Grande       -->
      <!-- ========================================================= -->
      <a-entity
        gltf-model="#pieza6"
        position="0 0.40 -1.0"
        rotation="0 -90 0"
        ajustar-al-pedestal="tamanoMax: 5.8; elevacion: 0.0"
      ></a-entity>
      <a-entity
        position="0 1.05 2.47"
        rotation="-30 0 0"
        cartel-museo="titulo: Sarcosuchus Imperator; periodo: Cretácico Inferior (112 Ma); descripcion: Crocodilomorfo gigante que alcanzó hasta 12 metros de longitud. Habitó sistemas fluviales tropicales y poseía un hocico alargado adaptado para capturar grandes presas."
      ></a-entity>

      <!-- ========================================================= -->
      <!-- STAND ENTRADA OESTE                                       -->
      <!-- ========================================================= -->
      <a-entity
        gltf-model="#pieza4"
        position="-5.44 1.00 5.7"
        rotation="0 90 0"
        ajustar-al-pedestal="tamanoMax: 1.1; elevacion: 0.1"
      ></a-entity>
      <a-entity
        position="-4.47 0.89 5.7"
        rotation="-30 90 0"
        cartel-museo="titulo: Muestra GHUNLPam-28000; periodo: Colección UNLPam; descripcion: Pieza fósil catalogada en la colección institucional GHUNLPam. El modelo digital permite analizar su relieve superficial sin manipular el original."
      ></a-entity>

      <!-- ========================================================= -->
      <!-- STAND ENTRADA ESTE                                        -->
      <!-- ========================================================= -->
      <a-entity
        gltf-model="#pieza5"
        position="5.44 1.00 5.7"
        rotation="0 90 0"
        ajustar-al-pedestal="tamanoMax: 1.1; elevacion: 0.2"
      ></a-entity>
      <a-entity
        position="4.47 0.89 5.7"
        rotation="-30 -90 0"
        cartel-museo="titulo: Espécimen Fósil GHUNLPam-29818; periodo: Colección Ricardo; descripcion: Muestra integrante de la Colección Ricardo resguardada en la UNLPam, digitalizada para su preservación e inspección interactiva."
      ></a-entity>

      <!-- ========================================================= -->
      <!-- STAND CENTRO OESTE (Izquierda)                            -->
      <!-- ========================================================= -->
      <a-entity
        gltf-model="#pieza1"
        position="-5.44 1.00 0"
        rotation="0 180 0"
        ajustar-al-pedestal="tamanoMax: 1.1; elevacion: 0.0"
      ></a-entity>
      <a-entity
        position="-4.47 1.05 0"
        rotation="-30 90 0"
        cartel-museo="titulo: Cráneo Fósil de Primate (Macaca); periodo: Cenozoico / Cuaternario; descripcion: Espécimen craneal fosilizado que permite observar en detalle la morfología de las órbitas oculares, el arco cigomático y el desgaste de la serie dental superior."
      ></a-entity>

      <!-- ========================================================= -->
      <!-- STAND CENTRO ESTE (Derecha)                               -->
      <!-- ========================================================= -->
      <a-entity
        gltf-model="#pieza2"
        position="5.44 1.00 0"
        rotation="0 -90 0"
        ajustar-al-pedestal="tamanoMax: 1.5; elevacion: 0.2"
      ></a-entity>
      <a-entity
        position="4.47 1.05 0"
        rotation="-30 -90 0"
        cartel-museo="titulo: Montsecosuchus Depereti; periodo: Cretácico Inferior; descripcion: Pequeño reptil atoposáurido prehistórico de hábito semiacuático, caracterizado por su cráneo corto y excelente preservación articular en calizas litográficas."
      ></a-entity>

      <!-- ========================================================= -->
      <!-- STAND FONDO OESTE                                         -->
      <!-- ========================================================= -->
      <a-entity
        gltf-model="#pieza7"
        position="-5.44 1.00 -6.5"
        rotation="0 0 0"
        ajustar-al-pedestal="tamanoMax: 1.15; elevacion: 0.2"
      ></a-entity>
      <a-entity
        position="-4.47 1.05 -6.5"
        rotation="-30 90 0"
        cartel-museo="titulo: Icnofósil Avipeda (Muestra 8643); periodo: Icnología; descripcion: Huella fósil de ave prehistórica (*Avipeda*) conservada en sedimento consolidado, clave para el estudio del desplazamiento y paleoambiente de la fauna local."
      ></a-entity>

      <!-- ========================================================= -->
      <!-- STAND FONDO ESTE (Derecha)                                -->
      <!-- ========================================================= -->
      <a-entity
        gltf-model="#pieza3"
        position="5.44 1.00 -6.5"
        rotation="0 0 0"
        ajustar-al-pedestal="tamanoMax: 1.5; elevacion: 0.1wd"
      ></a-entity>
      <a-entity
        position="4.47 0.89 -5.7"
        rotation="-30 -90 0"
        cartel-museo="titulo: Muestra GHUNLPam-15375; periodo: Colección UNLPam; descripcion: Ejemplar perteneciente al repositorio paleontológico de la Universidad Nacional de La Pampa, escaneado tridimensionalmente para docencia e investigación.."
      ></a-entity>
    </a-scene>

    <!-- Audio nativo fuera de a-scene para compatibilidad total con navegadores móviles -->
    <audio
      id="musica-ambiente"
      src="assets/audio/ambiente.mp3"
      preload="auto"
      loop
      playsinline
    ></audio>

    <!-- Controles flotantes superiores -->
    <div
      style="
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 99999;
        display: flex;
        gap: 10px;
        font-family: sans-serif;
      "
    >
      <a
        href="index.html"
        style="
          background: rgba(22, 25, 34, 0.9);
          color: #f5d061;
          border: 1px solid #d4af37;
          padding: 10px 16px;
          border-radius: 8px;
          text-decoration: none;
          font-weight: bold;
          font-size: 14px;
          backdrop-filter: blur(6px);
        "
      >
        ⬅ Inicio
      </a>
      <button
        id="btn-musica"
        type="button"
        style="
          background: rgba(22, 25, 34, 0.9);
          color: #e8eaed;
          border: 1px solid #d4af37;
          padding: 10px 16px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: bold;
          font-size: 14px;
          backdrop-filter: blur(6px);
          touch-action: manipulation;
        "
      >
        🔊 Tocar para activar música
      </button>
    </div>

    <script>
      (function () {
        const audio = document.getElementById("musica-ambiente");
        const btnMusica = document.getElementById("btn-musica");
        const escena = document.querySelector("a-scene");
        if (!audio || !btnMusica) return;

        audio.volume = 0.25;
        let silenciadoManual = false;
        let desbloqueado = false;

        function actualizarBoton() {
          if (audio.paused) {
            btnMusica.textContent = silenciadoManual
              ? "🔇 Música: Silenciada"
              : "🔊 Tocar para activar música";
            btnMusica.style.borderColor = "rgba(255,255,255,0.25)";
          } else {
            btnMusica.textContent = "🔊 Música: Sonando";
            btnMusica.style.borderColor = "#d4af37";
          }
        }

        function intentarReproducir() {
          if (silenciadoManual) return;

          // Despertar el contexto de audio de A-Frame/Three.js en móviles si existe
          if (escena && escena.audioListener && escena.audioListener.context) {
            if (escena.audioListener.context.state === "suspended") {
              escena.audioListener.context.resume();
            }
          }

          if (audio.paused) {
            const promesa = audio.play();
            if (promesa !== undefined) {
              promesa
                .then(() => {
                  desbloqueado = true;
                  actualizarBoton();
                  eliminarListenersDesbloqueo();
                })
                .catch(() => {
                  // Sigue esperando un toque directo (touchend / click) en pantalla
                });
            }
          }
        }

        // Control manual desde el botón superior
        function alternarMusica(e) {
          e.stopPropagation();
          e.preventDefault();
          if (audio.paused) {
            silenciadoManual = false;
            audio.play().then(() => {
              desbloqueado = true;
              actualizarBoton();
            });
          } else {
            silenciadoManual = true;
            audio.pause();
            actualizarBoton();
          }
        }

        btnMusica.addEventListener("click", alternarMusica);
        btnMusica.addEventListener("touchend", alternarMusica, {
          passive: false,
        });

        // Eventos válidos en móviles (touchend y pointerup son los que habilitan el audio en Android/iOS)
        const eventosValidos = ["touchend", "pointerup", "click", "keydown"];

        function eliminarListenersDesbloqueo() {
          eventosValidos.forEach((ev) => {
            window.removeEventListener(ev, intentarReproducir, true);
            document.removeEventListener(ev, intentarReproducir, true);
          });
        }

        eventosValidos.forEach((ev) => {
          window.addEventListener(ev, intentarReproducir, {
            capture: true,
            passive: true,
          });
          document.addEventListener(ev, intentarReproducir, {
            capture: true,
            passive: true,
          });
        });

        // Asegurar que al tocar el botón "VR" para poner el celular en los lentes siga sonando
        if (escena) {
          escena.addEventListener("enter-vr", () => {
            if (!silenciadoManual) {
              setTimeout(() => {
                audio
                  .play()
                  .then(actualizarBoton)
                  .catch(() => {});
              }, 150);
            }
          });
        }
      })();
    </script>

    <!-- Botón flotante para silenciar/activar música y volver al inicio -->
    <div
      style="
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 9999;
        display: flex;
        gap: 10px;
        font-family: sans-serif;
      "
    >
      <a
        href="index.html"
        style="
          background: rgba(22, 25, 34, 0.85);
          color: #f5d061;
          border: 1px solid #d4af37;
          padding: 10px 16px;
          border-radius: 8px;
          text-decoration: none;
          font-weight: bold;
          font-size: 14px;
          backdrop-filter: blur(6px);
        "
      >
        ⬅ Inicio
      </a>
      <button
        id="btn-musica"
        style="
          background: rgba(22, 25, 34, 0.85);
          color: #e8eaed;
          border: 1px solid rgba(255, 255, 255, 0.2);
          padding: 10px 16px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: bold;
          font-size: 14px;
          backdrop-filter: blur(6px);
        "
      >
        🔊 Música: Activada
      </button>
    </div>

    <script>
      (function () {
        const audio = document.getElementById("musica-ambiente");
        const btnMusica = document.getElementById("btn-musica");
        if (!audio) return;

        // Volumen suave (25%) para que acompañe el recorrido sin aturdir en los lentes RV
        audio.volume = 0.25;
        let silenciadoManual = false;

        function actualizarBoton() {
          if (audio.paused) {
            btnMusica.textContent = "🔇 Música: Silenciada";
            btnMusica.style.borderColor = "rgba(255,255,255,0.2)";
          } else {
            btnMusica.textContent = "🔊 Música: Sonando";
            btnMusica.style.borderColor = "#d4af37";
          }
        }

        function intentarReproducir() {
          if (silenciadoManual || !audio.paused) return;
          audio
            .play()
            .then(() => {
              actualizarBoton();
            })
            .catch(() => {
              // El navegador esperará a la primera interacción del usuario
            });
        }

        // Botón manual para pausar o reanudar
        btnMusica.addEventListener("click", (e) => {
          e.stopPropagation();
          if (audio.paused) {
            silenciadoManual = false;
            audio.play().then(actualizarBoton);
          } else {
            silenciadoManual = true;
            audio.pause();
            actualizarBoton();
          }
        });

        // 1. Activar al hacer clic, tocar la pantalla en el celular o presionar una tecla
        ["click", "touchstart", "keydown"].forEach((evento) => {
          window.addEventListener(evento, intentarReproducir, {
            passive: true,
          });
        });

        // 2. Activar también si el usuario mueve el stick o presiona un botón del mando GameSir
        setInterval(() => {
          if (silenciadoManual || !audio.paused) return;
          const gps = navigator.getGamepads ? navigator.getGamepads() : [];
          for (let i = 0; i < gps.length; i++) {
            const gp = gps[i];
            if (!gp || !gp.connected) continue;
            const movioStick =
              gp.axes && gp.axes.some((eje) => Math.abs(eje) > 0.25);
            const tocoBoton = gp.buttons && gp.buttons.some((b) => b.pressed);
            if (movioStick || tocoBoton) {
              intentarReproducir();
              break;
            }
          }
        }, 500);
      })();
    </script>
  </body>
</html>
